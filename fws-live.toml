# Live-robot session config. Commanding ENABLED — clear the cell before
# jogging or running programs; the console Stop is functional, not an E-stop.

[features]
# Exposes the generated command registry (GET /api/v1/commands,
# POST /api/v1/invoke/<name>). Used to query the controller's own
# GetForwardKin for the 3D-model fit — pure computation, moves nothing.
# Refused commands (firmware writes, shutdown, introspection) stay refused.
enable_command_passthrough = true

[services]
# Controller-side QNX services, enabled for developer diagnosis.
# FTP (21) gives a true directory listing and raw file reads — this is how
# the console reaches the controller's own logs. Reads are low-risk; the
# gateway still gates every call behind its lock and audit.
ftp_enabled = true

# The controller's internal Lua validator (8060): compile-check a program
# without uploading it.
lua_validate_enabled = true

# MEASURED: this controller's QNXNTO-ftpd (20081216) sends its 220 greeting
# after exactly 30 s — a reverse-DNS lookup on the client address that has
# to time out first. The 8 s default therefore never sees a banner and every
# FTP call fails as "unreachable". 45 s clears it with margin.
connect_timeout_s = 45.0
command_timeout_s = 60.0

# shell (telnet) and qconn are root-equivalent on this hardware, so the
# gateway refuses to serve them without an API key file. They are enabled
# in the auth-protected profile, not here.
